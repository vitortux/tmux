set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

setw -g mode-keys vi

# Set new panes to open in current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Mapeia os atalhos do choose-tree (sessions) para iniciarem em 1 em vez de 0
bind -T prefix s choose-tree -s -Z \
  -F "#{session_name}: #{session_windows} windows#{?session_attached, (attached),}" \
  -K "#{?#{e|<:#{line},9},#{e|+:#{line},1},#{?#{e|<:#{line},36},M-#{a:#{e|+:97,#{e|-:#{line},10}}},}}"

# Linka a janela atual em todas as outras sessões (mesmo índice se livre, senão no final)
bind O run-shell "set -f; me='#{session_id}'; wid='#{window_id}'; idx='#{window_index}'; n=0; for s in \$(tmux list-sessions -F '##{session_id}'); do [ \"\$s\" = \"\$me\" ] && continue; tmux list-windows -t \"\$s\" -F '##{window_id}' | grep -qxF -- \"\$wid\" && continue; if tmux list-windows -t \"\$s\" -F '##{window_index}' | grep -qx -- \"\$idx\"; then last=\$(tmux list-windows -t \"\$s\" -F '##{window_index}' | sort -n | tail -n1); tgt=\"\$s:\$last\"; opt='-a'; else tgt=\"\$s:\$idx\"; opt=''; fi; tmux link-window -d \$opt -s \"\$wid\" -t \"\$tgt\" && n=\$((n+1)); done; tmux display-message \"window linked to \$n session(s)\"; exit 0"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'
set -g @plugin "janoamaral/tokyo-night-tmux"
set -g @plugin 'tmux-plugins/tmux-sessionist'
set -g @plugin 'sainnhe/tmux-fzf'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
